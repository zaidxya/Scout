<!doctype html>
<html lang="ar" dir="rtl" data-title="title_dashboard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كشاف الفوج الثاني</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-v2.png">
  <link rel="apple-touch-icon" href="/favicon-v2.png">
  <meta name="theme-color" content="#671e93">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="grow"><h1><a class="brand" href="/"><img src="/logo-mark.png" alt=""><span data-i18n="title"></span></a></h1><p data-i18n="subtitle"></p></div>
    <nav>
      <details class="menu" data-page="scouts"></details>
      <button id="langBtn" type="button" class="lang" data-i18n="lang_toggle">العربية</button>
    </nav>
  </header>
  <main class="cols">
    <button id="backList" class="btn ghost small back-list" type="button" data-i18n="back_to_list"></button>
    <section>
      <select id="troopPick" class="hidden"></select>
      <input id="search" type="search" data-i18n-ph="search" aria-label="Search">
      <ul id="list" class="scout-list"></ul>
    </section>
    <section id="detail" class="detail"></section>
  </main>
  <script src="/common.js"></script>
  <script>
    const listEl = document.getElementById('list'), detailEl = document.getElementById('detail'), search = document.getElementById('search');
    let scouts = [], patrols = [], troops = [], troop = null, current = null, data = null;
    let staff = false, me = null, priv = null; // staff: a signed-in account sees the scout's private details (read-only); editing stays in the leader area
    const privCache = {};
    const picker = document.getElementById('troopPick');
    const detailCache = {}; // last seen detail per scout, shown instantly while the fresh copy loads

    function drawList() {
      const q = norm(search.value.trim());
      const hit = (s) => { const p = patrols.find((x) => x.id === s.patrol_id); return [s.name, p?.name_en, p?.name_ar, ...(s.roles || []).flatMap((r) => [r.name_en, r.name_ar])].some((v) => norm(v).includes(q)); };
      renderScoutList(listEl, scouts.filter(hit), current, openScout, (s) => el('span', { class: 'sub' }, roleChips(s.roles)), scouts.length ? 'no_results' : 'no_scouts', patrols); // split under a heading per patrol when the troop has any
    }
    let loading = false;
    function drawDetail() {
      detailEl.replaceChildren();
      if (loading) return detailEl.append(el('p', { class: 'empty' }, t('loading')));
      if (!data) return detailEl.append(el('p', { class: 'empty' }, t('select_scout')));
      detailEl.append(renderDetailHead(data), ...(priv && priv.id === data.id ? [privateCard(priv)] : []), renderLog(data));
    }
    // the private details as plain text: signed-in accounts only, and only for scouts the account may open (its own troop; all troops for the super admin and leaders)
    const PRIV = [['d_full_name', 'full_name'], ['d_phone', 'phone', 'tel'], ['d_join_date', 'join_date', 'day'], ['d_birth_date', 'birth_date', 'day'],
      ['d_guardian_name', 'guardian_name'], ['d_guardian_phone', 'guardian_phone', 'tel'], ['d_address', 'address'], ['d_medical', 'medical_notes'], ['d_notes', 'notes']];
    function privateCard(p) {
      const rows = PRIV.filter(([, k]) => p[k]).flatMap(([label, k, kind]) => [
        el('dt', {}, t(label)),
        el('dd', {}, el('bdi', {}, kind === 'tel' ? el('a', { href: 'tel:' + p[k], dir: 'ltr' }, p[k]) : kind === 'day' ? fmtDay(p[k]) : p[k]))]); // dd keeps the page direction (so every value starts beside its label); bdi gives each value its own text direction
      return el('div', { class: 'panel priv' },
        el('h3', {}, t('private_info')),
        el('p', { class: 'hint' }, t('private_view_hint')),
        rows.length ? el('dl', { class: 'priv-dl' }, rows) : el('p', { class: 'empty' }, t('private_none')),
        p.tags && p.tags.length ? el('div', {}, el('h4', {}, t('tags')), roleChips(p.tags)) : '',
        !(me && (me.role === 'super_admin' || me.role === 'general_leader' || me.troop_id === p.troop_id)) ? '' : // editing is only offered where the account may edit
        el('a', { class: 'btn ghost small', href: '/leader.html', onclick: () => { try { localStorage.setItem('leaderTroop', String(p.troop_id)); } catch { /* ignore */ } } }, t('private_edit')));
    }
    async function openScout(id) {
      current = id;
      history.replaceState(null, '', '#' + id);
      drawList();
      openDetailView(document.querySelector('main.cols')); // phones: the page replaces the list (no scrolling down)
      data = detailCache[id] || null; priv = staff ? privCache[id] || null : null; loading = !data; drawDetail(); // cached copy (or a loading note) right away
      const privReq = staff ? api('/api/leader/scouts/' + id).catch(() => null) : null; // null: another troop's scout for an admin or mod
      try {
        const fresh = await api('/api/scouts/' + id);
        if (current !== id) return; // the visitor already picked someone else
        const freshPriv = privReq ? await privReq : null;
        if (current !== id) return;
        const changed = JSON.stringify(fresh) !== JSON.stringify(data) || JSON.stringify(freshPriv) !== JSON.stringify(priv);
        detailCache[id] = data = fresh; privCache[id] = priv = freshPriv; loading = false;
        if (fresh.troop_id && fresh.troop_id !== troop && troops.some((x) => x.id === fresh.troop_id)) await switchTroop(fresh.troop_id, true); // link to a scout of another troop
        if (changed) drawDetail();
      } catch { if (current !== id) return; if (!data) { loading = false; drawDetail(); } }
      loading = false;
    }
    document.getElementById('backList').addEventListener('click', closeDetailView);
    search.addEventListener('input', frame(drawList));

    // ---- troops: one list per troop, picker only shown when there is more than one ----
    const troopLabel = (x) => (state.lang === 'ar' ? x.name_ar : x.name_en);
    function drawPicker() {
      picker.replaceChildren(...troops.map((x) => el('option', { value: String(x.id) }, troopLabel(x))));
      picker.value = String(troop);
      picker.setAttribute('aria-label', t('troop_picker'));
      picker.classList.toggle('hidden', troops.length < 2);
    }
    const listCache = (id) => { try { return JSON.parse(localStorage.getItem('scouts_cache_' + id)) || []; } catch { return []; } };
    async function loadList(id) {
      const l = await api('/api/scouts?troop=' + id);
      try { localStorage.setItem('scouts_cache_' + id, JSON.stringify(l)); } catch { /* storage full */ }
      return l;
    }
    // patrols: the names are cached like the scout list; the patrol word (Rovers say رهط) follows the troop's theme, remembered for the first paint
    const patrolCache = (id) => { try { return JSON.parse(localStorage.getItem('patrols_cache_' + id)) || []; } catch { return []; } };
    async function loadPatrols(id) {
      const p = await api('/api/patrols?troop=' + id);
      try { localStorage.setItem('patrols_cache_' + id, JSON.stringify(p)); } catch { /* storage full */ }
      return p;
    }
    function useTroopWord(id) {
      const tr = troops.find((x) => x.id === id);
      // does this troop use XP? (remembered like the theme, for the first paint before the troop list is loaded)
      if (tr) { try { localStorage.setItem('xp_' + id, tr.xp_enabled === false ? '0' : '1'); } catch { /* ignore */ } setXpEnabled(tr.xp_enabled); }
      else { let c = null; try { c = localStorage.getItem('xp_' + id); } catch { /* ignore */ } setXpEnabled(c !== '0'); }
      const th = tr?.theme;
      if (th) { try { localStorage.setItem('unit_theme_' + id, th); } catch { /* ignore */ } setUnitTheme(th); setTroopTint(th); }
      else { let c = null; try { c = localStorage.getItem('unit_theme_' + id); } catch { /* ignore */ } setUnitTheme(c); setTroopTint(c); }
    }
    async function switchTroop(id, keepScout) {
      troop = id; try { localStorage.setItem('troop', id); } catch { /* ignore */ }
      useTroopWord(id); patrols = patrolCache(id);
      picker.value = String(id);
      if (!keepScout) { current = null; data = null; loading = false; history.replaceState(null, '', location.pathname); drawDetail(); }
      scouts = listCache(id);
      if (scouts.length) drawList(); else listEl.replaceChildren(el('li', { class: 'empty', style: 'padding:.75rem .5rem' }, t('loading')));
      const [fresh, freshP] = await Promise.all([loadList(id).catch(() => null), loadPatrols(id).catch(() => null)]);
      if (troop !== id) return; // the visitor already picked another troop
      if (freshP) patrols = freshP;
      if (fresh && JSON.stringify(fresh) !== JSON.stringify(scouts)) scouts = fresh;
      drawList();
    }
    picker.addEventListener('change', () => switchTroop(Number(picker.value)));
    document.addEventListener('langchange', () => { if (troops.length) drawPicker(); drawList(); drawDetail(); });

    (async () => {
      // show the last list we saw immediately, then swap in the fresh one (no empty screen on repeat visits)
      const saved = parseInt(localStorage.getItem('troop'), 10) || null; // the troop this visitor looked at last time
      const troopsReq = api('/api/troops').catch(() => []);
      const freshReq = saved ? loadList(saved).catch(() => null) : null; // start loading it now, in parallel
      const freshPReq = saved ? loadPatrols(saved).catch(() => null) : null;
      await initLang();
      me = await getMe(); staff = !!me; // signed in? (also decides whether a scout's private details are fetched)
      if (saved && listCache(saved).length) { troop = saved; scouts = listCache(saved); patrols = patrolCache(saved); useTroopWord(saved); drawList(); }
      troops = await troopsReq;
      const want = troops.some((x) => x.id === saved) ? saved : troops[0]?.id;
      if (want) { troop = want; useTroopWord(want); drawPicker(); }
      const fresh = want === saved && freshReq ? await freshReq : want ? await loadList(want).catch(() => null) : [];
      const freshP = want === saved && freshPReq ? await freshPReq : want ? await loadPatrols(want).catch(() => null) : [];
      scouts = fresh || (want === saved ? scouts : []);
      patrols = freshP || (want === saved ? patrols : []);
      drawList();
      const id = parseInt(location.hash.slice(1), 10);
      if (id) openScout(id); else drawDetail();
    })();
  </script>
</body>
</html>
