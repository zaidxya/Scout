<!doctype html>
<html lang="ar" dir="rtl" data-title="title_leader">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كشاف الفوج الثاني</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-v2.png">
  <link rel="apple-touch-icon" href="/favicon-v2.png">
  <meta name="theme-color" content="#671e93">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="grow"><h1><a class="brand" href="/"><img src="/logo-mark.png" alt=""><span data-i18n="title"></span><small id="brandSlogan" class="brand-slogan hidden"></small></a></h1><p data-i18n="leader_area"></p><p id="meName" dir="auto" style="font-weight:700;opacity:1;padding-inline-end:1rem;border-inline-end:1px solid rgba(var(--on-primary-rgb),.4)"></p></div>
    <nav>
      <details class="menu" data-page="leader"></details>
      <button id="langBtn" type="button" class="lang" data-i18n="lang_toggle">العربية</button>
    </nav>
  </header>
  <main>
    <form id="loginForm" class="panel login">
      <h2 data-i18n="login_title"></h2>
      <label><span data-i18n="username"></span><input name="username" type="text" autocomplete="username" required></label>
      <label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit" data-i18n="login"></button>
      <p id="loginErr" class="error" role="alert"></p>
    </form>

    <div id="app" class="hidden">
      <div id="viewBar" class="troop-bar hidden"><label for="viewSwitch" data-i18n="view_as_label"></label><select id="viewSwitch"></select></div>
      <div id="troopBar" class="troop-bar hidden"><label for="troopSwitch" data-i18n="working_in"></label><select id="troopSwitch"></select></div>
      <div class="tabs" role="tablist">
        <button id="btn-scouts" type="button" role="tab" data-i18n="tab_scouts"></button>
        <button id="btn-addscout" type="button" role="tab" data-i18n="add_scout"></button>
        <button id="btn-activities" type="button" role="tab" data-i18n="tab_activities"></button>
        <button id="btn-patrols" type="button" role="tab" data-unit="tab_patrols"></button>
        <button id="btn-attendance" type="button" role="tab" data-i18n="tab_attendance"></button>
        <button id="btn-labels" type="button" role="tab" data-i18n="tab_labels"></button>
        <!-- Troops, Leaders and the Activity log (super admin) are in the header menu, under Administration -->
      </div>
      <p id="toast" class="error" role="status"></p>

      <!-- adding a scout has its own tab, between Scouts and the rest -->
      <div id="tab-addscout" class="hidden" style="max-width:42rem">
        <!-- the same fields as a scout's details form: only the name is required -->
        <form id="addForm" class="panel">
          <h2 data-i18n="add_scout"></h2>
          <label><span data-i18n="d_name"></span><input name="name" type="text" maxlength="60" required></label>
          <p class="hint" data-i18n="public_field"></p>
          <p class="hint private" data-i18n="private_section"></p>
          <div class="grid2">
            <label><span data-i18n="d_full_name"></span><input name="full_name" type="text" maxlength="120"></label>
            <label><span data-i18n="d_phone"></span><input name="phone" type="tel" class="phone" inputmode="numeric" pattern="[0-9]*" placeholder="0000000000" maxlength="40" dir="ltr"></label>
            <label><span data-i18n="d_join_date"></span><input name="join_date" type="date"></label>
            <label><span data-i18n="d_birth_date"></span><input name="birth_date" type="date"></label>
            <label><span data-i18n="d_guardian_name"></span><input name="guardian_name" type="text" maxlength="120"></label>
            <label><span data-i18n="d_guardian_phone"></span><input name="guardian_phone" type="tel" class="phone" inputmode="numeric" pattern="[0-9]*" placeholder="0000000000" maxlength="40" dir="ltr"></label>
          </div>
          <label><span data-i18n="d_address"></span><textarea name="address" maxlength="300"></textarea></label>
          <label><span data-i18n="d_medical"></span><textarea name="medical_notes" maxlength="1000"></textarea></label>
          <label><span data-i18n="d_notes"></span><textarea name="notes" maxlength="1000"></textarea></label>
          <button class="btn" type="submit" data-i18n="add"></button>
        </form>
      </div>

      <div id="tab-scouts" class="cols">
        <button id="backList" class="btn ghost small back-list" type="button" data-i18n="back_to_list"></button>
        <section>
          <input id="q" type="search" data-i18n-ph="search_leader" aria-label="Search">
          <ul id="list" class="scout-list"></ul>
          <label class="inline-check"><input id="showInactive" type="checkbox"> <span data-i18n="show_inactive"></span> <small id="inactiveCount"></small></label>
          <h3 id="inactiveTitle" class="hidden" data-i18n="inactive_title"></h3>
          <ul id="inactiveList" class="scout-list inactive hidden"></ul>
        </section>
        <section id="right" class="detail"></section>
      </div>

      <div id="tab-activities" class="hidden">
        <div class="panel">
          <h2 data-i18n="activities_title"></h2>
          <p id="actHint" class="hint" data-i18n="activity_hint"></p>
          <ul id="actList" class="simple-list"></ul>
          <form id="actForm">
            <h3 data-i18n="add_activity"></h3>
            <div class="grid2">
              <label><span data-i18n="name_en"></span><input name="name_en" type="text" maxlength="60"></label>
              <label><span data-i18n="name_ar"></span><input name="name_ar" type="text" maxlength="60" dir="rtl"></label>
            </div>
            <label><span data-i18n="xp_value"></span><input name="xp" type="number" min="-10000" max="10000" step="1" required style="max-width:10rem"></label>
            <button class="btn" type="submit" data-i18n="add"></button>
          </form>
        </div>
      </div>

      <div id="tab-patrols" class="hidden">
        <div class="panel">
          <h2 data-unit="patrols_title"></h2>
          <p class="hint" data-unit="patrols_hint"></p>
          <ul id="patrolList" class="simple-list"></ul>
          <form id="patrolForm">
            <h3 data-unit="add_patrol"></h3>
            <div class="grid2">
              <label><span data-i18n="name_en"></span><input name="name_en" type="text" maxlength="40"></label>
              <label><span data-i18n="name_ar"></span><input name="name_ar" type="text" maxlength="40" dir="rtl"></label>
            </div>
            <button class="btn" type="submit" data-i18n="add"></button>
          </form>
        </div>
      </div>

      <div id="tab-attendance" class="hidden">
        <div id="attHome">
          <div class="panel">
            <h2 data-i18n="tab_attendance"></h2>
            <p id="attHint" class="hint" data-i18n="att_hint"></p>
            <p id="attNoPatrol" class="hint hidden" data-i18n="mod_no_patrol"></p>
            <form id="meetingForm">
              <h3 id="meetingFormTitle" data-i18n="att_new_meeting"></h3>
              <h3 id="meetingFormTitleMod" class="hidden" data-unit="att_new_patrol_meeting"></h3>
              <div class="grid2">
                <label><span data-i18n="att_date"></span><input name="date" type="date" required></label>
                <label><span data-i18n="att_title"></span><input name="title" type="text" maxlength="80" required></label>
              </div>
              <label id="kindLabel"><span data-i18n="att_type"></span><select name="kind" style="max-width:12rem"><option value="meeting" data-i18n="att_kind_meeting"></option><option value="event" data-i18n="att_kind_event"></option><option id="kindPatrolOpt" value="patrol" data-unit="att_kind_patrol"></option></select></label>
              <label id="meetingPatrolLabel" class="hidden"><span data-unit="patrol_select"></span><select name="patrol_id" style="max-width:12rem"></select></label>
              <div id="meetingXp">
                <div class="grid2">
                  <label><span data-i18n="att_xp"></span><input name="xp" type="number" min="0" max="1000" step="1" value="10" required></label>
                  <label><span data-i18n="att_absent_xp"></span><input name="absent_xp" type="number" min="0" max="1000" step="1" value="0" required></label>
                </div>
                <p class="hint" data-i18n="att_xp_field_hint"></p>
              </div>
              <button class="btn" type="submit" data-i18n="add"></button>
            </form>
          </div>
          <div class="panel">
            <h3 data-i18n="att_meetings"></h3>
            <div class="filter-row">
              <input id="meetingQ" type="search" data-i18n-ph="att_search" aria-label="Search">
              <select id="meetingKind" aria-label="Type"><option value="" data-i18n="att_kind_all"></option><option value="meeting" data-i18n="att_kind_meeting"></option><option value="event" data-i18n="att_kind_event"></option><option value="patrol" data-unit="att_kind_patrol"></option></select>
            </div>
            <ul id="meetingList" class="simple-list"></ul>
          </div>
          <div class="panel">
            <h3 data-i18n="att_summary_title"></h3>
            <p class="hint" data-i18n="att_summary_hint"></p>
            <ul id="attSummary" class="simple-list"></ul>
          </div>
        </div>
        <div id="attSheet" class="panel hidden"></div>
      </div>

      <div id="tab-labels" class="hidden">
        <div class="panel">
          <h2 data-i18n="labels_title"></h2>
          <p class="hint" data-i18n="labels_hint"></p>
          <div id="labelLists"></div>
          <form id="labelForm">
            <h3 data-i18n="add_label"></h3>
            <label><span data-i18n="label_type"></span>
              <select name="kind" style="max-width:12rem"><option value="role" data-i18n="kind_role"></option><option value="tag" data-i18n="kind_tag"></option></select></label>
            <div class="grid2">
              <label><span data-i18n="name_en"></span><input name="name_en" type="text" maxlength="40"></label>
              <label><span data-i18n="name_ar"></span><input name="name_ar" type="text" maxlength="40" dir="rtl"></label>
            </div>
            <label><span data-i18n="color"></span><input name="color" type="color" value="#d3ad80" class="swatch"></label>
            <label><span data-i18n="priority"></span><input name="priority" type="number" min="0" max="1000" step="1" value="0" style="max-width:8rem"></label>
            <p class="hint" data-i18n="priority_hint"></p>
            <button class="btn" type="submit" data-i18n="add"></button>
          </form>
        </div>
      </div>

    </div>
  </main>
  <script src="/common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let scouts = [], current = null, data = null, det = null, acts = [], labels = [], patrols = [], leaders = [], troops = [], me = '', myRole = 'admin', myTroop = null; // myTroop: the account's own troop (null for the super admin, who is not bound to one)
    const activeTroop = () => state.troop; // the troop being worked on: myTroop, or whichever one the super admin or a leader switched to
    const isSuper = () => myRole === 'super_admin';
    const roams = () => myRole === 'super_admin' || myRole === 'leader';
    const xpOn = () => troopById(activeTroop())?.xp_enabled !== false; // does the troop being worked on use the XP system? // can switch between troops (leaders have a home troop, the super admin none)
    const TABS = ['scouts', 'addscout', 'activities', 'patrols', 'attendance', 'labels'];
    const BTN_TABS = TABS; // (Administration has its own site, /admin.html)
    const isMod = () => myRole === 'mod'; // a mod (رائد) has the members of its own patrol and their activity (and its own password)
    const canLabels = () => isSuper() || myRole === 'admin'; // roles and tags: not for mods or leaders
    // troops, accounts and the activity log are for the super admin only; roles & tags and activities also for admins (not leaders); a mod has just scouts, patrols and attendance
    const tabAllowed = (n) => isMod() ? (n === 'scouts' || n === 'addscout' || n === 'attendance') : (n === 'labels' ? canLabels() : n === 'activities' ? myRole !== 'leader' && xpOn() : true);

    const msg = (text, ok) => { $('toast').textContent = text || ''; $('toast').className = 'error' + (ok ? ' ok' : ''); };
    const fail = (e) => { if (e.status === 401 && e.code === 'unauthorized') show(false); msg(errText(e)); };

    function show(authed) {
      $('loginForm').classList.toggle('hidden', authed);
      $('app').classList.toggle('hidden', !authed);
      $('meName').textContent = authed && me ? me : '';
      $('meName').style.display = authed && me ? '' : 'none';
    }
    // hide the admin-only and super-admin-only pieces from everyone else
    function applyRole() {
      BTN_TABS.forEach((x) => $('btn-' + x).classList.toggle('hidden', !tabAllowed(x)));
    }
    function showTab(n) {
      if (!tabAllowed(n)) n = 'scouts';
      msg('');
      TABS.forEach((x) => {
        $('tab-' + x).classList.toggle('hidden', x !== n);
        const b = $('btn-' + x); // (no button for the Administration pages: nothing is lit while one of them is open)
        if (!b) return;
        b.setAttribute('aria-selected', String(x === n));
        if (x === n) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      });
      if (n === 'addscout') $('addForm').elements.name.focus();
      if (n === 'activities') loadActs();
      if (n === 'patrols') loadPatrols();
      if (n === 'attendance') openAttendance();
      if (n === 'labels') loadLabels();
    }
    BTN_TABS.forEach((x) => $('btn-' + x).addEventListener('click', () => showTab(x)));
    // ---------- scouts ----------
    const labelName = (l) => (state.lang === 'ar' ? l.name_ar : l.name_en);
    const labelById = (id) => labels.find((l) => l.id === id);
    async function loadScouts() { const at = troopLoad, r = await api('/api/leader/scouts'); if (at !== troopLoad) return; scouts = r; drawList(); } // dropped if the troop was switched meanwhile

    // search matches name, full name, phone, and the names of assigned roles/tags (both languages)
    function matches(s, q) {
      if (!q) return true;
      const names = s.label_ids.map(labelById).filter(Boolean).flatMap((l) => [l.name_en, l.name_ar]);
      const p = patrols.find((x) => x.id === s.patrol_id);
      return [s.name, s.full_name, s.phone, ...names, p?.name_en, p?.name_ar].some((v) => norm(v).includes(q));
    }
    function chips(ids) {
      return el('span', { class: 'chips' }, ids.map(labelById).filter(Boolean)
        .map((l) => el('span', { class: 'chip ' + l.kind, style: chipStyle(l) }, labelName(l))));
    }
    // ---------- troops (names, switcher) ----------
    const troopName = (tr) => (tr ? (state.lang === 'ar' ? tr.name_ar : tr.name_en) : '');
    const troopById = (id) => troops.find((x) => x.id === id);
    // the super admin's troop switcher (only shown when there is more than one troop) and the "start with" choice in the add-troop form
    function fillTroopSelects() {
      const sw = $('troopSwitch');
      sw.replaceChildren(...troops.map((x) => el('option', { value: String(x.id) }, troopName(x))));
      if (activeTroop() != null) sw.value = String(activeTroop());
      sw.setAttribute('aria-label', t('troop_picker'));
      $('troopBar').classList.toggle('hidden', !(roams() && troops.length > 1));
    }
    // the troop's slogan ("Always Prepared"), in the header beside the troop's name, when it has one (set in Administration > Troops)
    function paintTroopLine(tr) {
      const s = (tr && (state.lang === 'ar' ? tr.slogan_ar || tr.slogan_en : tr.slogan_en || tr.slogan_ar)) || '', b = $('brandSlogan');
      b.textContent = s; b.classList.toggle('hidden', !s);
    }
    // pick the troop the super admin or a leader works in: the saved one if it still exists, otherwise the first
    function chooseTroop(id) {
      const ok = troops.some((x) => x.id === id);
      state.troop = ok ? id : troops[0]?.id ?? null;
      if (roams()) { try { localStorage.setItem('leaderTroop', String(state.troop)); } catch { /* ignore */ } }
      const tr = troopById(state.troop);
      paintTroopLine(tr);
      setXpEnabled(tr?.xp_enabled); // off: no XP anywhere for this troop
      if (BTN_TABS.every((x) => $('btn-' + x))) { applyRole(); const open = TABS.find((x) => !$('tab-' + x).classList.contains('hidden')); if (open && !tabAllowed(open)) showTab('scouts'); }
      setUnitTheme(tr?.theme); paintUnits(); // Rovers call their patrols رهط
      applyTheme(tr?.theme, { en: tr?.brand_en, ar: tr?.brand_ar }, tr && { en: tr.name_en, ar: tr.name_ar }); // the leader area wears the identity (and tab title) of the troop being worked on
    }
    // everything below the switcher belongs to one troop, so switching reloads it all
    // troopLoad counts troop switches: a reply that arrives after a newer switch belongs to the old troop and is dropped
    let troopLoad = 0;
    async function loadTroopData() {
      const mine = ++troopLoad;
      current = null; data = det = null; acts = []; labels = []; patrols = []; scouts = []; meetings = []; meeting = null;
      drawList(); drawDetail(); // nothing of the previous troop stays on screen while the new one loads
      const r = await Promise.all([api('/api/activities'), api('/api/labels'), api('/api/patrols?troop=' + activeTroop()), api('/api/leader/scouts')]);
      if (mine !== troopLoad) return;
      [acts, labels, patrols, scouts] = r;
      drawList(); drawDetail(); drawActs(); drawLabels(); drawPatrols();
      if (!$('tab-attendance').classList.contains('hidden')) openAttendance();
    }
    $('troopSwitch').addEventListener('change', async () => {
      chooseTroop(Number($('troopSwitch').value)); msg('');
      try { await loadTroopData(); } catch (e) { fail(e); }
    });

    const modNoPatrol = () => isMod() && !scouts.some((s) => s.editable); // a mod whose own profile has no patrol can change nobody (its own profile is in its patrol, so a mod with one always has someone)
    const editable = (s) => !s || s.editable !== false; // a mod sees every scout but changes only its patrol's (the server says which)
    function drawList() {
      const q = norm($('q').value.trim());
      const live = scouts.filter((s) => s.active !== false), off = scouts.filter((s) => s.active === false);
      renderScoutList($('list'), live.filter((s) => matches(s, q)), current, (id) => openScout(id),
        (s) => el('span', { class: 'sub' }, chips(s.label_ids)),
        live.length ? 'no_results' : 'no_scouts', patrols);
      // a mod whose own profile has no patrol yet controls nobody: say why
      if (modNoPatrol()) $('list').prepend(el('li', { class: 'empty' }, t('mod_no_patrol')));
      // deactivated scouts (left the movement) are kept out of the list unless asked for
      $('inactiveCount').textContent = off.length ? `(${fmt(off.length)})` : '';
      const showOff = $('showInactive').checked && off.length > 0;
      $('inactiveTitle').classList.toggle('hidden', !showOff); $('inactiveList').classList.toggle('hidden', !showOff);
      if (showOff) renderScoutList($('inactiveList'), off.filter((s) => matches(s, q)), current, (id) => openScout(id), null, 'no_results');
    }
    $('q').addEventListener('input', frame(drawList));
    $('showInactive').addEventListener('change', drawList);

    async function openScout(id, scrollNext = true) {
      current = id; drawList();
      if (scrollNext) openDetailView($('tab-scouts')); // phones: the page replaces the list (no scrolling down)
      const troopAtStart = troopLoad;
      let r = null;
      try { r = await Promise.all([api('/api/scouts/' + id), api('/api/leader/scouts/' + id), loadActsQuiet()]); }
      catch (e) { if (current === id) fail(e); }
      // a slow reply for a scout that is no longer selected (another click, or a troop switch) must not replace what's on screen:
      // it used to show the wrong scout, and a role picked there could wipe that scout's roles and tags
      if (current !== id || troopAtStart !== troopLoad) return;
      [data, det] = r || [null, null];
      if (data && det) data = { ...data, has_photo: det.has_photo, photo_hidden: det.photo_hidden }; // the public copy hides a hidden picture; here it is shown
      drawDetail();
    }
    $('backList').addEventListener('click', closeDetailView);
    async function loadActsQuiet() { if (!acts.length) acts = await api('/api/activities'); }

    // phone fields accept digits only (Arabic-Indic digits are converted to 0-9)
    const digitsOnly = (v) => String(v || '').replace(/[٠-٩]/g, (d) => d.charCodeAt(0) - 0x660).replace(/[۰-۹]/g, (d) => d.charCodeAt(0) - 0x6f0).replace(/\D/g, '');
    function field(key, name, value, type = 'text', extra = {}) {
      if (type === 'tel') {
        const input = el('input', { name, type: 'tel', class: 'phone', inputmode: 'numeric', pattern: '[0-9]*', placeholder: '0000000000', maxlength: extra.max || 40, value: digitsOnly(value), dir: 'ltr' });
        input.addEventListener('input', () => { const v = digitsOnly(input.value); if (v !== input.value) input.value = v; });
        return el('label', {}, t(key), input);
      }
      const input = type === 'textarea'
        ? el('textarea', { name, maxlength: extra.max || 1000 }, value || '')
        : el('input', { name, type, maxlength: extra.max || 120, value: value || '', ...(extra.required ? { required: '' } : {}) });
      return el('label', {}, t(key), input);
    }

    function resizeImage(file, size = 256) {
      return new Promise((resolve, reject) => {
        const img = new Image(), url = URL.createObjectURL(file);
        img.onload = () => {
          const s = Math.min(img.width, img.height), c = document.createElement('canvas');
          c.width = c.height = size;
          c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => reject(Object.assign(new Error('invalid_input'), { code: 'invalid_input' }));
        img.src = url;
      });
    }

    function drawDetail() {
      const box = $('right');
      box.replaceChildren();
      if (!data || !det) { closeDetailView(); return box.append(el('p', { class: 'empty' }, t('select_scout'))); } // nobody selected any more (deactivated, promoted, troop switch): back to the list
      const id = data.id;
      const refresh = async () => { await loadScouts(); if (current === id) await openScout(id, false); }; // unless another scout (or troop) was picked meanwhile

      // award XP from the activity list
      const sel = el('select', { name: 'activity_id', required: '', 'aria-label': t('activity_select') },
        el('option', { value: '' }, t('activity_select')),
        acts.map((a) => el('option', { value: a.id }, `${state.lang === 'ar' ? a.name_ar : a.name_en} (${signed(a.xp)} ${t('xp')})`)),
        el('option', { value: 'custom' }, t('activity_custom'))); // a one-off award with its own title and XP
      const customTitle = el('input', { name: 'custom_title', type: 'text', maxlength: '80' }), customXp = el('input', { name: 'custom_xp', type: 'number', step: '1', min: '-10000', max: '10000', placeholder: '10' });
      const customBox = el('div', { class: 'hidden' },
        el('label', {}, t('custom_title'), customTitle), el('label', {}, t('custom_xp'), customXp), el('p', { class: 'hint' }, t('custom_xp_hint')));
      sel.addEventListener('change', () => {
        const on = sel.value === 'custom';
        customBox.classList.toggle('hidden', !on); customTitle.required = customXp.required = on;
        if (on) customTitle.focus();
      });
      const awardForm = el('form', { class: 'panel' },
        el('h2', {}, t('award_xp')),
        el('label', {}, t('activity_select'), sel), customBox,

          const before = stateOf(s.id), status = before === want ? 'none' : want;
          pb.disabled = ab.disabled = eb.disabled = true;
          try { await api(`/api/meetings/${m.id}/attendance/${s.id}`, 'PUT', { status }); } catch (e) { pb.disabled = ab.disabled = eb.disabled = false; return fail(e); }
          pb.disabled = ab.disabled = eb.disabled = !can;
          present.delete(s.id); absent.delete(s.id); excused.delete(s.id); if (status === 'present') present.add(s.id); if (status === 'absent') absent.add(s.id); if (status === 'excused') excused.add(s.id);
          const delta = xpWorth(status) - xpWorth(before);
          save(); msg(delta ? t('att_xp_change').replace('{xp}', signed(delta)) : t('saved'), true);
        };
        pb.addEventListener('click', press('present')); ab.addEventListener('click', press('absent')); eb.addEventListener('click', press('excused'));
        return el('li', {}, el('span', { class: 'grow', dir: 'auto' }, s.name), el('span', { class: 'att-btns' }, pb, ab, eb));
      };
      // grouped like the scout lists: each patrol under its own heading (the leaders' patrol first), scouts without one last
      const groups = m.kind === 'patrol' ? (list.length ? [[meetingPatrol(m) ? patrolName(meetingPatrol(m)) : '', list]] : []) : patrols.map((p) => [patrolName(p), list.filter((s) => s.patrol_id === p.id || (p.is_leadership && s.in_council))])
        .concat([[tu('no_patrol'), list.filter((s) => !s.patrol_id && !s.in_council)]]).filter(([, g]) => g.length);
      refreshCount();
      box.replaceChildren(
        el('div', { class: 'row' }, el('button', { class: 'btn small', type: 'button', onclick: () => openAttendance() }, t('att_back')), el('span', { class: 'grow' }), counter),
        el('h2', {}, meetingLabel(m), ' ', el('span', { class: 'chip' }, kindChip(m))),
        !xpOn() ? '' : el('p', { class: 'hint' }, m.xp ? t('att_xp_hint').replace('{xp}', fmt(m.xp)) : t('att_xp_none')),
        xpOn() && m.absent_xp ? el('p', { class: 'hint' }, t('att_absent_hint').replace('{xp}', fmt(m.absent_xp))) : '',
        // a mod only marks attendance on meetings and events; the date, title, type and XP of those are changed by the others
        ...(!canEdit ? [] : [
        el('div', { class: 'grid2' }, el('label', {}, el('span', {}, t('att_date')), dateIn), el('label', {}, el('span', {}, t('att_title')), titleIn)),
        xpOn() ? el('div', { class: 'grid2' }, kindEl, el('label', {}, el('span', {}, t('att_xp')), xpIn)) : kindEl,
        xpOn() ? el('label', {}, el('span', {}, t('att_absent_xp')), absentXpIn) : '',
        el('div', { class: 'row' },
          el('button', { class: 'btn small', type: 'button', onclick: async () => {
            if (!titleIn.reportValidity() || !xpIn.reportValidity() || !absentXpIn.reportValidity() || !dateIn.reportValidity()) return; // a title is required
            try {
              await api('/api/meetings/' + m.id, 'PUT', { date: dateIn.value, title: titleIn.value, kind: m.kind === 'patrol' ? 'patrol' : kindIn.value, xp: xpIn.value, absent_xp: absentXpIn.value });
              m.meeting_date = dateIn.value; m.title = titleIn.value.trim() || null; m.kind = m.kind === 'patrol' ? 'patrol' : kindIn.value; m.xp = Number(xpIn.value); m.absent_xp = Number(absentXpIn.value);
              loadScouts().catch(() => {}); msg(t('saved'), true); drawSheet();
            } catch (e) { fail(e); }
          } }, t('save')),
          el('button', { class: 'btn quiet small', type: 'button', onclick: async () => {
            if (!(await confirmBox(t('confirm_delete_meeting')))) return;
            try { await api('/api/meetings/' + m.id, 'DELETE'); msg(''); await openAttendance(); } catch (e) { fail(e); }
          } }, t('delete')))]),
        modNoPatrol() ? '' : el('div', { class: 'row', style: 'margin:.75rem 0' }, // (a mod with no patrol has no one to mark)
          el('button', { class: 'btn small', type: 'button', onclick: () => setAll('present') }, t('att_all')),
          el('button', { class: 'btn ghost small', type: 'button', onclick: () => setAll('absent') }, t('att_rest_absent')),
          el('button', { class: 'btn quiet small', type: 'button', onclick: () => setAll('none') }, t('att_clear'))),
        ...(groups.length ? groups.flatMap(([name, g]) => [el('h3', {}, name), el('ul', { class: 'simple-list' }, g.map(row))]) : [el('p', { class: 'empty' }, t('att_no_scouts'))]));
    }
    $('meetingForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const kind = isMod() ? 'patrol' : f.get('kind'); // (the server puts a mod's meeting in the mod's own patrol)
      try { const m = await api('/api/meetings', 'POST', { date: f.get('date'), title: f.get('title'), kind, patrol_id: kind === 'patrol' && !isMod() ? f.get('patrol_id') : undefined, xp: f.get('xp'), absent_xp: f.get('absent_xp') }); ev.target.elements.title.value = ''; ev.target.elements.xp.value = '10'; ev.target.elements.absent_xp.value = '0'; msg(''); await openAttendance(m.id); }
      catch (e) { fail(e); }
    });

    // ---------- roles and tags ----------
    async function loadLabels() { try { labels = await api('/api/labels'); drawLabels(); drawList(); if (data && det) drawDetail(); } catch (e) { fail(e); } }
    function drawLabels() {
      $('labelLists').replaceChildren(...[['role', 'roles'], ['tag', 'tags']].map(([kind, key]) => {
        const rows = labels.filter((l) => l.kind === kind);
        return el('div', {}, el('h3', {}, t(key)),
          el('ul', { class: 'simple-list' }, rows.length ? rows.map((l) => el('li', { class: 'lbl' },
            el('span', { class: 'chip ' + kind, style: chipStyle(l) }, labelName(l)),
            el('input', { type: 'color', value: l.color || '#d3ad80', 'aria-label': t('color'), class: 'swatch', onchange: (ev) => updateLabel(l, { color: ev.target.value }) }),
            l.color ? el('button', { class: 'btn ghost small', type: 'button', onclick: () => updateLabel(l, { color: '' }) }, t('default_color')) : '',
            kind === 'role' ? el('input', { type: 'number', min: '0', max: '1000', step: '1', value: String(l.priority || 0), class: 'prio', 'aria-label': t('priority'), title: t('priority'),
              onchange: (ev) => updateLabel(l, { priority: ev.target.value }) }) : '',
            el('span', { class: 'grow' }, l.name_en !== l.name_ar ? el('small', { style: 'opacity:.6' }, state.lang === 'ar' ? l.name_en : l.name_ar) : ''),
            el('button', { class: 'btn quiet small', type: 'button', onclick: async () => {
              if (!(await confirmBox(t('confirm_delete_label')))) return;
              try { await api('/api/labels/' + l.id, 'DELETE'); await loadLabels(); await loadScouts(); } catch (e) { fail(e); }
            } }, t('delete')))) : el('li', { class: 'empty' }, t('no_labels'))));
      }));
    }
    async function updateLabel(l, patch) {
      try { await api('/api/labels/' + l.id, 'PUT', patch); await loadLabels(); await loadScouts(); msg(t('saved'), true); } catch (e) { fail(e); }
    }
    $('labelForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      try { await api('/api/labels', 'POST', { kind: f.get('kind'), name_en: f.get('name_en'), name_ar: f.get('name_ar'), color: f.get('color'), priority: f.get('priority') }); ev.target.reset(); msg(t('saved'), true); await loadLabels(); }
      catch (e) { fail(e); }
    });

    // ---------- login / boot ----------
    // the super admin's "View as" choice: the accounts of every troop; picking one reloads the page as that account (read-only), the first entry goes back to the own account
    const acctName = (r) => t('acct_' + r);
    let viewAccts = [];
    function fillViewSwitch(current) {
      const sw = $('viewSwitch'), keep = current ?? sw.value;
      sw.replaceChildren(el('option', { value: '' }, t('view_as_self')),
        ...viewAccts.map((a) => el('option', { value: String(a.id) }, `${a.display_name || a.username} · ${acctName(a.role)} · ${state.lang === 'ar' ? a.troop_name_ar : a.troop_name_en}`)));
      sw.value = keep; sw.setAttribute('aria-label', t('view_as_label'));
    }
    async function setupViewBar(r) {
      try { viewAccts = await api('/api/view-as/accounts'); } catch { return; } // (the bar just stays hidden)
      fillViewSwitch(r.viewing ? String(r.viewing.id) : '');
      $('viewBar').classList.remove('hidden');
    }
    $('viewSwitch').addEventListener('change', () => { setViewAs($('viewSwitch').value); location.reload(); });
    async function enter(username, role, troop, look) {
      me = username; myRole = role || 'admin'; myTroop = troop ?? null;
      let saved = null; try { saved = parseInt(localStorage.getItem('leaderTroop'), 10) || null; } catch { /* ignore */ }
      state.troop = myTroop; // the super admin has none yet (a leader starts in their home troop): the first request below uses the first troop until one is chosen
      if (!isSuper()) applyTheme(look?.theme, { en: look?.brand_en, ar: look?.brand_ar });
      show(true); applyRole(); showTab('scouts');
      try {
        troops = await api('/api/troops');
        chooseTroop(roams() ? saved ?? myTroop : myTroop); // the super admin and leaders start in the troop they used last (leaders: else their own); everyone else in their own
        fillTroopSelects();
        [acts, labels, patrols, scouts] = await Promise.all([api('/api/activities'), api('/api/labels'), api('/api/patrols?troop=' + activeTroop()), api('/api/leader/scouts')]);
        drawList(); drawPatrols();
      } catch (e) { fail(e); }
      drawDetail();
      if (look?.real_role === 'super_admin') setupViewBar(look);
    }
    $('loginForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      try {
        const r = await api('/api/login', 'POST', { username: f.get('username'), password: f.get('password') });
        $('loginErr').textContent = ''; ev.target.reset();
        // signing in sends you back to the page you came from (the Sign in link of another page names it); coming straight to the leader area, you stay in it
        // only a page of this site: the URL parser catches tricks like "/\evil.com" that a plain "starts with /" check lets through
        try {
          const u = new URL(new URLSearchParams(location.search).get('next') || '/leader.html', location.origin);
          if (u.origin === location.origin && u.pathname !== '/leader.html') { location.replace(u.pathname + u.search + u.hash); return; }
        } catch { /* malformed: stay in the leader area */ }
        location.reload();
      } catch (e) { $('loginErr').textContent = errText(e); }
    });

    document.addEventListener('langchange', () => {
      if ($('app').classList.contains('hidden')) return;
      // the scout details form is rebuilt in the new language: keep what was typed but not saved yet
      const form = $('detailForm'), typed = form && Object.fromEntries(new FormData(form));
      paintUnits(); fillTroopSelects(); paintTroopLine(troopById(activeTroop())); if (viewAccts.length) fillViewSwitch(); drawList(); drawDetail(); drawActs(); drawPatrols(); drawLabels(); drawAttendance();
      const again = $('detailForm');
      if (typed && again) Object.entries(typed).forEach(([k, v]) => { if (again.elements[k]) again.elements[k].value = v; });
    });

    (async () => {
      const [, r] = await Promise.all([initLang(), getMe()]); // language + session check at the same time (the session check is shared with common.js)
      if (r) await enter(r.username, r.role, r.troop_id, r); else show(false);
    })();
  </script>
</body>
</html>
