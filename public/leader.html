<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scout Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="grow"><h1 data-i18n="title">Scout Tracker</h1><p data-i18n="leader_area"></p></div>
    <nav>
      <a href="/" data-i18n="home">Dashboard</a>
      <button id="logoutBtn" type="button" class="hidden" data-i18n="logout"></button>
      <button id="langBtn" type="button"></button>
    </nav>
  </header>
  <main>
    <form id="loginForm" class="panel login">
      <h2 data-i18n="login_title"></h2>
      <label><span data-i18n="username"></span><input name="username" type="text" autocomplete="username" required></label>
      <label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit" data-i18n="login"></button>
      <p id="loginErr" class="error" role="alert"></p>
    </form>

    <section id="left" class="hidden">
      <form id="addForm" class="panel">
        <h2 data-i18n="add_scout"></h2>
        <div class="row">
          <input name="name" type="text" maxlength="60" data-i18n-ph="scout_name" aria-label="Scout name" required>
          <button class="btn" type="submit" data-i18n="add"></button>
        </div>
      </form>
      <ul id="list" class="scout-list"></ul>
    </section>

    <section id="right" class="detail hidden"></section>
  </main>
  <p id="toast" class="error" role="alert" style="text-align:center"></p>
  <script src="/common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let scouts = [], current = null, data = null;

    const show = (authed) => {
      $('loginForm').classList.toggle('hidden', authed);
      $('left').classList.toggle('hidden', !authed);
      $('right').classList.toggle('hidden', !authed);
      $('logoutBtn').classList.toggle('hidden', !authed);
    };
    const fail = (e) => {
      if (e.status === 401 && e.code === 'unauthorized') show(false);
      $('toast').textContent = errText(e);
    };

    async function loadScouts() { scouts = await api('/api/scouts'); drawList(); }
    function drawList() { renderScoutList($('list'), scouts, current, openScout); }

    async function openScout(id) {
      current = id; drawList();
      try { data = await api('/api/scouts/' + id); } catch (e) { data = null; fail(e); }
      drawDetail();
    }

    function drawDetail() {
      const box = $('right');
      box.replaceChildren();
      if (!data) return box.append(el('p', { class: 'empty' }, t('select_scout')));

      const form = el('form', { class: 'panel' },
        el('h2', {}, t('award_xp')),
        el('label', {}, t('activity'), el('input', { name: 'activity', type: 'text', maxlength: '100', required: '' })),
        el('label', {}, t('xp_amount'), el('input', { name: 'xp', type: 'number', step: '1', min: '-10000', max: '10000', required: '' })),
        el('p', { class: 'hint' }, t('xp_hint')),
        el('label', {}, t('note'), el('input', { name: 'note', type: 'text', maxlength: '200' })),
        el('button', { class: 'btn', type: 'submit' }, t('award')));
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = new FormData(form);
        try {
          await api(`/api/scouts/${data.id}/xp`, 'POST', { activity: f.get('activity'), xp: Number(f.get('xp')), note: f.get('note') });
          $('toast').textContent = '';
          await loadScouts(); await openScout(data.id);
        } catch (e) { fail(e); }
      });

      const del = el('button', { class: 'btn quiet', type: 'button', style: 'margin-top:1.5rem', onclick: async () => {
        if (!confirm(t('confirm_delete'))) return;
        try { await api('/api/scouts/' + data.id, 'DELETE'); current = null; data = null; await loadScouts(); drawDetail(); }
        catch (e) { fail(e); }
      } }, t('delete_scout'));

      box.append(renderDetailHead(data), form, renderLog(data, async (xpId) => {
        if (!confirm(t('confirm_undo'))) return;
        try { await api('/api/xp/' + xpId, 'DELETE'); await loadScouts(); await openScout(data.id); } catch (e) { fail(e); }
      }), del);
    }

    $('loginForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      try {
        await api('/api/login', 'POST', { username: f.get('username'), password: f.get('password') });
        $('loginErr').textContent = ''; ev.target.reset();
        show(true); await loadScouts(); drawDetail();
      } catch (e) { $('loginErr').textContent = errText(e); }
    });
    $('logoutBtn').addEventListener('click', async () => { await api('/api/logout', 'POST'); data = null; current = null; show(false); });
    $('addForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const name = new FormData(ev.target).get('name');
      try { const s = await api('/api/scouts', 'POST', { name }); ev.target.reset(); await loadScouts(); await openScout(s.id); }
      catch (e) { fail(e); }
    });
    document.addEventListener('langchange', () => { drawList(); if (!$('right').classList.contains('hidden')) drawDetail(); });

    (async () => {
      await initLang();
      try { await api('/api/me'); show(true); await loadScouts(); drawDetail(); } catch { show(false); }
    })();
  </script>
</body>
</html>
