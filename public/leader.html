<!doctype html>
<html lang="ar" dir="rtl" data-title="title_leader">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>القيادة</title>
  <link rel="icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="grow"><h1><a href="/" style="border:0;padding:0"><img src="/logo.jpg" alt="جولات"></a></h1><p data-i18n="leader_area"></p><p id="meName" dir="auto" style="font-weight:700;opacity:1;padding-inline-end:1rem;border-inline-end:1px solid rgba(211,173,128,.5)"></p></div>
    <nav>
      <a href="/" data-i18n="home">Dashboard</a>
      <button id="logoutBtn" type="button" class="hidden" data-i18n="logout"></button>
      <button id="langBtn" type="button" class="lang" data-i18n="lang_toggle">العربية</button>
    </nav>
  </header>
  <main>
    <form id="loginForm" class="panel login">
      <h2 data-i18n="login_title"></h2>
      <label><span data-i18n="username"></span><input name="username" type="text" autocomplete="username" required></label>
      <label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit" data-i18n="login"></button>
      <p id="loginErr" class="error" role="alert"></p>
    </form>

    <div id="app" class="hidden">
      <div class="tabs" role="tablist">
        <button id="btn-scouts" type="button" role="tab" data-i18n="tab_scouts"></button>
        <button id="btn-activities" type="button" role="tab" data-i18n="tab_activities"></button>
        <button id="btn-labels" type="button" role="tab" data-i18n="tab_labels"></button>
        <button id="btn-leaders" type="button" role="tab" data-i18n="tab_leaders"></button>
        <button id="btn-log" type="button" role="tab" data-i18n="tab_log"></button>
        <button id="btn-password" type="button" role="tab" data-i18n="tab_password"></button>
      </div>
      <p id="toast" class="error" role="status"></p>

      <div id="tab-scouts" class="cols">
        <section>
          <form id="addForm" class="panel">
            <h2 data-i18n="add_scout"></h2>
            <div class="row">
              <input name="name" type="text" maxlength="60" data-i18n-ph="scout_name" aria-label="Scout name" required>
              <button class="btn" type="submit" data-i18n="add"></button>
            </div>
          </form>
          <input id="q" type="search" data-i18n-ph="search_leader" aria-label="Search">
          <ul id="list" class="scout-list"></ul>
        </section>
        <section id="right" class="detail"></section>
      </div>

      <div id="tab-activities" class="hidden">
        <div class="panel">
          <h2 data-i18n="activities_title"></h2>
          <p class="hint" data-i18n="activity_hint"></p>
          <ul id="actList" class="simple-list"></ul>
          <form id="actForm">
            <h3 data-i18n="add_activity"></h3>
            <div class="grid2">
              <label><span data-i18n="name_en"></span><input name="name_en" type="text" maxlength="60"></label>
              <label><span data-i18n="name_ar"></span><input name="name_ar" type="text" maxlength="60" dir="rtl"></label>
            </div>
            <label><span data-i18n="xp_value"></span><input name="xp" type="number" min="-10000" max="10000" step="1" required style="max-width:10rem"></label>
            <button class="btn" type="submit" data-i18n="add"></button>
          </form>
        </div>
      </div>

      <div id="tab-log" class="hidden">
        <div class="panel">
          <h2 data-i18n="log_title"></h2>
          <ul id="logList" class="simple-list"></ul>
        </div>
      </div>

      <div id="tab-labels" class="hidden">
        <div class="panel">
          <h2 data-i18n="labels_title"></h2>
          <p class="hint" data-i18n="labels_hint"></p>
          <div id="labelLists"></div>
          <form id="labelForm">
            <h3 data-i18n="add_label"></h3>
            <label><span data-i18n="label_type"></span>
              <select name="kind" style="max-width:12rem"><option value="role" data-i18n="kind_role"></option><option value="tag" data-i18n="kind_tag"></option></select></label>
            <div class="grid2">
              <label><span data-i18n="name_en"></span><input name="name_en" type="text" maxlength="40"></label>
              <label><span data-i18n="name_ar"></span><input name="name_ar" type="text" maxlength="40" dir="rtl"></label>
            </div>
            <label><span data-i18n="color"></span><input name="color" type="color" value="#d3ad80" class="swatch"></label>
            <label><span data-i18n="priority"></span><input name="priority" type="number" min="0" max="1000" step="1" value="0" style="max-width:8rem"></label>
            <p class="hint" data-i18n="priority_hint"></p>
            <button class="btn" type="submit" data-i18n="add"></button>
          </form>
        </div>
      </div>

      <div id="tab-password" class="hidden">
        <form id="pwForm" class="panel">
          <h2 data-i18n="change_password"></h2>
          <div class="grid2">
            <label><span data-i18n="current_password"></span><input name="current" type="password" autocomplete="current-password" required></label>
            <label><span data-i18n="new_password"></span><input name="next" type="password" autocomplete="new-password" minlength="8" required></label>
          </div>
          <button class="btn" type="submit" data-i18n="save"></button>
        </form>
      </div>

      <div id="tab-leaders" class="hidden">
        <div id="leaderPanel" class="panel">
          <h2 data-i18n="leaders_title"></h2>
          <ul id="leaderList" class="simple-list"></ul>
          <form id="leaderForm">
            <h3 data-i18n="add_leader"></h3>
            <div class="grid2">
              <label><span data-i18n="username"></span><input name="username" type="text" autocomplete="off" pattern="[A-Za-z0-9_.\-]{3,40}" required></label>
              <label><span data-i18n="password"></span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
            </div>
            <p class="hint" data-i18n="pw_hint"></p>
            <label id="roleField" class="hidden"><span data-i18n="account_type"></span>
              <select name="role" style="max-width:12rem"><option value="leader" data-i18n="acct_leader"></option><option value="admin" data-i18n="acct_admin"></option></select></label>
            <label><span data-i18n="display_name"></span><input name="display_name" type="text" maxlength="60"></label>
            <p class="hint" data-i18n="display_name_hint"></p>
            <button class="btn" type="submit" data-i18n="add"></button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <script src="/common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let scouts = [], current = null, data = null, det = null, acts = [], labels = [], leaders = [], me = '', myRole = 'leader';
    const isAdmin = () => myRole === 'admin' || myRole === 'super_admin';
    const TABS = ['scouts', 'activities', 'labels', 'leaders', 'log', 'password'];
    const ADMIN_TABS = ['labels', 'leaders', 'log']; // only admins see these

    const msg = (text, ok) => { $('toast').textContent = text || ''; $('toast').className = 'error' + (ok ? ' ok' : ''); };
    const fail = (e) => { if (e.status === 401 && e.code === 'unauthorized') show(false); msg(errText(e)); };

    function show(authed) {
      $('loginForm').classList.toggle('hidden', authed);
      $('app').classList.toggle('hidden', !authed);
      $('logoutBtn').classList.toggle('hidden', !authed);
      $('meName').textContent = authed && me ? me : '';
      $('meName').style.display = authed && me ? '' : 'none';
    }
    // hide the admin-only tabs from regular leaders
    function applyRole() { ADMIN_TABS.forEach((x) => $('btn-' + x).classList.toggle('hidden', !isAdmin())); }
    function showTab(n) {
      if (ADMIN_TABS.includes(n) && !isAdmin()) n = 'scouts';
      msg('');
      TABS.forEach((x) => {
        $('tab-' + x).classList.toggle('hidden', x !== n);
        $('btn-' + x).setAttribute('aria-selected', String(x === n));
        if (x === n) $('btn-' + x).scrollIntoView({ block: 'nearest', inline: 'nearest' });
      });
      if (n === 'activities') loadActs();
      if (n === 'labels') loadLabels();
      if (n === 'leaders' && isAdmin()) loadLeaders();
      if (n === 'log') loadLog();
    }
    TABS.forEach((x) => $('btn-' + x).addEventListener('click', () => showTab(x)));

    // ---------- scouts ----------
    const labelName = (l) => (state.lang === 'ar' ? l.name_ar : l.name_en);
    const labelById = (id) => labels.find((l) => l.id === id);
    async function loadScouts() { scouts = await api('/api/leader/scouts'); drawList(); }

    // search matches name, full name, phone, group, and the names of assigned roles/tags (both languages)
    function matches(s, q) {
      if (!q) return true;
      const names = s.label_ids.map(labelById).filter(Boolean).flatMap((l) => [l.name_en, l.name_ar]);
      return [s.name, s.full_name, s.phone, s.group_name, ...names].some((v) => norm(v).includes(q));
    }
    function chips(ids) {
      return el('span', { class: 'chips' }, ids.map(labelById).filter(Boolean)
        .map((l) => el('span', { class: 'chip ' + l.kind, style: chipStyle(l) }, labelName(l))));
    }
    function drawList() {
      const q = norm($('q').value.trim());
      const shown = scouts.filter((s) => matches(s, q));
      renderScoutList($('list'), shown, current, (id) => openScout(id),
        (s) => el('span', { class: 'sub' }, chips(s.label_ids)),
        scouts.length ? 'no_results' : 'no_scouts');
    }
    $('q').addEventListener('input', drawList);

    async function openScout(id, scrollNext = true) {
      current = id; drawList();
      try {
        [data, det] = await Promise.all([api('/api/scouts/' + id), api('/api/leader/scouts/' + id), loadActsQuiet()]);
      } catch (e) { data = det = null; fail(e); }
      drawDetail();
      if (scrollNext && matchMedia('(max-width: 760px)').matches) $('right').scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
    async function loadActsQuiet() { if (!acts.length) acts = await api('/api/activities'); }

    function field(key, name, value, type = 'text', extra = {}) {
      const input = type === 'textarea'
        ? el('textarea', { name, maxlength: extra.max || 1000 }, value || '')
        : el('input', { name, type, maxlength: extra.max || 120, value: value || '', ...(extra.required ? { required: '' } : {}) });
      return el('label', {}, t(key), input);
    }

    function resizeImage(file, size = 256) {
      return new Promise((resolve, reject) => {
        const img = new Image(), url = URL.createObjectURL(file);
        img.onload = () => {
          const s = Math.min(img.width, img.height), c = document.createElement('canvas');
          c.width = c.height = size;
          c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => reject(Object.assign(new Error('invalid_input'), { code: 'invalid_input' }));
        img.src = url;
      });
    }

    function drawDetail() {
      const box = $('right');
      box.replaceChildren();
      if (!data || !det) return box.append(el('p', { class: 'empty' }, t('select_scout')));
      const refresh = async () => { await loadScouts(); await openScout(data.id, false); };

      // award XP from the activity list
      const sel = el('select', { name: 'activity_id', required: '', 'aria-label': t('activity_select') },
        el('option', { value: '' }, t('activity_select')),
        acts.map((a) => el('option', { value: a.id }, `${state.lang === 'ar' ? a.name_ar : a.name_en} (${signed(a.xp)} ${t('xp')})`)));
      const awardForm = el('form', { class: 'panel' },
        el('h2', {}, t('award_xp')),
        el('label', {}, t('activity_select'), sel),
        el('label', {}, t('note'), el('input', { name: 'note', type: 'text', maxlength: '200' })),
        el('button', { class: 'btn', type: 'submit' }, t('award')));
      awardForm.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = new FormData(awardForm);
        try { await api(`/api/scouts/${data.id}/xp`, 'POST', { activity_id: Number(f.get('activity_id')), note: f.get('note') }); msg(''); await refresh(); }
        catch (e) { fail(e); }
      });

      // roles and tags
      const mine = (scouts.find((s) => s.id === data.id) || { label_ids: [] }).label_ids;
      const saveLabels = async (ids) => {
        try { await api(`/api/scouts/${data.id}/labels`, 'PUT', { label_ids: ids }); msg(''); await refresh(); } catch (e) { fail(e); }
      };
      const labelBlock = (kind, titleKey) => {
        const own = labels.filter((l) => l.kind === kind && mine.includes(l.id));
        const free = labels.filter((l) => l.kind === kind && !mine.includes(l.id));
        const pick = el('select', { 'aria-label': t(titleKey) }, el('option', { value: '' }, t('add_to_scout')),
          free.map((l) => el('option', { value: l.id }, labelName(l))));
        pick.addEventListener('change', () => { if (pick.value) saveLabels([...mine, Number(pick.value)]); });
        return el('div', { style: 'margin-bottom:.9rem' }, el('h3', {}, t(titleKey)),
          own.length ? el('div', { class: 'chips big' }, own.map((l) => el('span', { class: 'chip ' + kind, style: chipStyle(l) },
            labelName(l), el('button', { type: 'button', 'aria-label': t('remove'), onclick: () => saveLabels(mine.filter((i) => i !== l.id)) }, '×'))))
            : el('p', { class: 'empty', style: 'margin:.2rem 0' }, t('no_labels')),
          free.length ? pick : '');
      };
      const labelsPanel = el('div', { class: 'panel' }, labelBlock('role', 'roles'), labelBlock('tag', 'tags'));

      // photo
      const file = el('input', { type: 'file', accept: 'image/*', class: 'hidden' });
      file.addEventListener('change', async () => {
        if (!file.files[0]) return;
        try { await api(`/api/scouts/${data.id}/photo`, 'PUT', { image: await resizeImage(file.files[0]) }); msg(''); await refresh(); }
        catch (e) { fail(e); }
      });
      const photoRow = el('div', { class: 'row', style: 'margin-bottom:1rem' },
        avatar(data, true),
        el('button', { class: 'btn ghost small', type: 'button', onclick: () => file.click() }, t('change_photo')),
        data.has_photo ? el('button', { class: 'btn quiet small', type: 'button', onclick: async () => {
          try { await api(`/api/scouts/${data.id}/photo`, 'DELETE'); await refresh(); } catch (e) { fail(e); }
        } }, t('remove_photo')) : '', file);

      // details (public name + private fields)
      const form = el('form', { class: 'panel' },
        el('h2', {}, t('details')), photoRow,
        field('d_name', 'name', det.name, 'text', { max: 60, required: true }),
        el('p', { class: 'hint' }, t('public_field')),
        el('p', { class: 'hint private' }, t('private_section')),
        el('div', { class: 'grid2' },
          field('d_full_name', 'full_name', det.full_name),
          field('d_group', 'group_name', det.group_name, 'text', { max: 60 }),
          field('d_phone', 'phone', det.phone, 'text', { max: 40 }),
          field('d_join_date', 'join_date', det.join_date, 'date'),
          field('d_birth_date', 'birth_date', det.birth_date, 'date'),
          field('d_guardian_name', 'guardian_name', det.guardian_name),
          field('d_guardian_phone', 'guardian_phone', det.guardian_phone, 'text', { max: 40 })),
        field('d_address', 'address', det.address, 'textarea', { max: 300 }),
        field('d_medical', 'medical_notes', det.medical_notes, 'textarea'),
        field('d_notes', 'notes', det.notes, 'textarea'),
        el('button', { class: 'btn', type: 'submit' }, t('save')));
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        try { await api('/api/scouts/' + data.id, 'PUT', Object.fromEntries(new FormData(form))); await refresh(); msg(t('saved'), true); }
        catch (e) { fail(e); }
      });

      const del = el('button', { class: 'btn quiet', type: 'button', style: 'margin-top:1.5rem', onclick: async () => {
        if (!(await confirmBox(t('confirm_delete'), t('delete_scout')))) return;
        try { await api('/api/scouts/' + data.id, 'DELETE'); current = null; data = det = null; await loadScouts(); drawDetail(); }
        catch (e) { fail(e); }
      } }, t('delete_scout'));

      box.append(renderDetailHead(data, false), awardForm, labelsPanel,
        renderLog(data, async (xpId) => {
          if (!(await confirmBox(t('confirm_undo'), t('undo')))) return;
          try { await api('/api/xp/' + xpId, 'DELETE'); await refresh(); } catch (e) { fail(e); }
        }),
        el('div', { style: 'height:1.25rem' }), form, del);
    }

    $('addForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      try {
        const s = await api('/api/scouts', 'POST', { name: new FormData(ev.target).get('name') });
        ev.target.reset(); msg(''); await loadScouts(); await openScout(s.id);
      } catch (e) { fail(e); }
    });

    // ---------- activities ----------
    async function loadActs() { try { acts = await api('/api/activities'); drawActs(); } catch (e) { fail(e); } }
    function drawActs() {
      $('actList').replaceChildren(...acts.map((a) => el('li', {},
        el('span', { class: 'grow' }, state.lang === 'ar' ? a.name_ar : a.name_en),
        el('b', { style: a.xp < 0 ? 'color:var(--danger)' : '' }, `${signed(a.xp)} ${t('xp')}`),
        el('button', { class: 'btn quiet small', type: 'button', onclick: async () => {
          if (!(await confirmBox(t('confirm_delete_activity')))) return;
          try { await api('/api/activities/' + a.id, 'DELETE'); await loadActs(); } catch (e) { fail(e); }
        } }, t('delete')))));
    }
    $('actForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      try { await api('/api/activities', 'POST', { name_en: f.get('name_en'), name_ar: f.get('name_ar'), xp: Number(f.get('xp')) }); ev.target.reset(); msg(''); await loadActs(); }
      catch (e) { fail(e); }
    });

    // ---------- activity log ----------
    let logRows = [];
    async function loadLog() { try { logRows = await api('/api/audit'); drawLog(); } catch (e) { fail(e); } }
    function describe(r) {
      const m = r.meta || {}, ar = state.lang === 'ar';
      const act = ar ? m.activity_ar : m.activity_en;
      const verb = t('audit_' + r.action);
      switch (r.action) {
        case 'xp_award': return `${verb} ${signed(m.xp)} ${t('xp')} (${act}) ${t('audit_to')} ${m.name}`;
        case 'xp_undo': return `${verb} ${signed(m.xp)} ${t('xp')} (${act}) ${t('audit_from')} ${m.name}`;
        case 'activity_add': return `${verb} ${ar ? m.name_ar : m.name_en} (${signed(m.xp)} ${t('xp')})`;
        case 'activity_delete': return `${verb} ${ar ? m.name_ar : m.name_en}`;
        case 'login': case 'logout': case 'password_change': return verb;
        default: return `${verb} ${m.name || ''}`;
      }
    }
    function drawLog() {
      const ul = $('logList');
      if (!logRows.length) { ul.replaceChildren(el('li', { class: 'empty' }, t('log_empty'))); return; }
      ul.replaceChildren(...logRows.map((r) => el('li', {},
        el('span', { class: 'grow' }, el('b', {}, r.leader_name), ' ', describe(r),
          el('small', { style: 'display:block;opacity:.7' }, new Date(r.created_at).toLocaleString(locale(), { dateStyle: 'medium', timeStyle: 'short' }))))));
    }

    // ---------- roles and tags ----------
    async function loadLabels() { try { labels = await api('/api/labels'); drawLabels(); drawList(); if (data && det) drawDetail(); } catch (e) { fail(e); } }
    function drawLabels() {
      $('labelLists').replaceChildren(...[['role', 'roles'], ['tag', 'tags']].map(([kind, key]) => {
        const rows = labels.filter((l) => l.kind === kind);
        return el('div', {}, el('h3', {}, t(key)),
          el('ul', { class: 'simple-list' }, rows.length ? rows.map((l) => el('li', { class: 'lbl' },
            el('span', { class: 'chip ' + kind, style: chipStyle(l) }, labelName(l)),
            el('input', { type: 'color', value: l.color || '#d3ad80', 'aria-label': t('color'), class: 'swatch', onchange: (ev) => updateLabel(l, { color: ev.target.value }) }),
            l.color ? el('button', { class: 'btn ghost small', type: 'button', onclick: () => updateLabel(l, { color: '' }) }, t('default_color')) : '',
            kind === 'role' ? el('input', { type: 'number', min: '0', max: '1000', step: '1', value: String(l.priority || 0), class: 'prio', 'aria-label': t('priority'), title: t('priority'),
              onchange: (ev) => updateLabel(l, { priority: ev.target.value }) }) : '',
            el('span', { class: 'grow' }, l.name_en !== l.name_ar ? el('small', { style: 'opacity:.6' }, state.lang === 'ar' ? l.name_en : l.name_ar) : ''),
            el('button', { class: 'btn quiet small', type: 'button', onclick: async () => {
              if (!(await confirmBox(t('confirm_delete_label')))) return;
              try { await api('/api/labels/' + l.id, 'DELETE'); await loadLabels(); await loadScouts(); } catch (e) { fail(e); }
            } }, t('delete')))) : el('li', { class: 'empty' }, t('no_labels'))));
      }));
    }
    async function updateLabel(l, patch) {
      try { await api('/api/labels/' + l.id, 'PUT', patch); await loadLabels(); await loadScouts(); msg(t('saved'), true); } catch (e) { fail(e); }
    }
    $('labelForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      try { await api('/api/labels', 'POST', { kind: f.get('kind'), name_en: f.get('name_en'), name_ar: f.get('name_ar'), color: f.get('color'), priority: f.get('priority') }); ev.target.reset(); msg(t('saved'), true); await loadLabels(); }
      catch (e) { fail(e); }
    });

    // ---------- leaders ----------
    async function loadLeaders() { try { leaders = await api('/api/leaders'); drawLeaders(); } catch (e) { fail(e); } }
    const acctName = (r) => t('acct_' + r);
    function drawLeaders() {
      $('roleField').classList.toggle('hidden', myRole !== 'super_admin'); // only the super admin can create admins
      $('leaderList').replaceChildren(...leaders.map((l) => {
        const pwRow = el('form', { class: 'row hidden' },
          el('input', { type: 'password', name: 'password', minlength: '8', required: '', autocomplete: 'new-password', placeholder: t('reset_pw_for'), 'aria-label': t('reset_pw_for') }),
          el('button', { class: 'btn small', type: 'submit' }, t('save')));
        pwRow.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          try { await api(`/api/leaders/${l.id}/password`, 'PUT', { password: new FormData(pwRow).get('password') }); pwRow.reset(); pwRow.classList.add('hidden'); msg(t('saved'), true); }
          catch (e) { fail(e); }
        });
        return el('li', { class: 'acct' },
          el('span', { class: 'grow' }, l.username, l.username === me ? ` ${t('you')}` : '', ' ',
            el('span', { class: 'chip' + (l.role === 'leader' ? '' : ' leader') }, acctName(l.role)),
            l.scout_name && l.scout_name !== l.username ? el('small', { style: 'display:block;opacity:.7' }, `${t('scout_profile')} ${l.scout_name}`) : ''),
          l.can_manage ? el('button', { class: 'btn ghost small', type: 'button', onclick: () => { pwRow.classList.toggle('hidden'); pwRow.querySelector('input').focus(); } }, t('reset_password')) : '',
          l.can_manage ? el('button', { class: 'btn quiet small', type: 'button', onclick: async () => {
            if (!(await confirmBox(t(l.role === 'admin' ? 'confirm_delete_admin' : 'confirm_delete_leader')))) return;
            try { await api('/api/leaders/' + l.id, 'DELETE'); await loadLeaders(); } catch (e) { fail(e); }
          } }, t('delete')) : '',
          pwRow);
      }));
    }
    $('leaderForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      try { await api('/api/leaders', 'POST', { username: f.get('username'), password: f.get('password'), display_name: f.get('display_name'), role: f.get('role') || 'leader' }); ev.target.reset(); msg(t('saved'), true); await loadLeaders(); await loadScouts(); }
      catch (e) { fail(e); }
    });
    $('pwForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      try { await api('/api/me/password', 'PUT', { current: f.get('current'), next: f.get('next') }); ev.target.reset(); msg(t('saved'), true); }
      catch (e) { fail(e); }
    });

    // ---------- login / boot ----------
    async function enter(username, role) {
      me = username; myRole = role || 'leader'; show(true); applyRole(); showTab('scouts'); drawLeaders();
      try { [acts, labels] = await Promise.all([api('/api/activities'), api('/api/labels')]); await loadScouts(); } catch (e) { fail(e); }
      drawDetail();
    }
    $('loginForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      try {
        const r = await api('/api/login', 'POST', { username: f.get('username'), password: f.get('password') });
        $('loginErr').textContent = ''; ev.target.reset(); await enter(r.username, r.role);
      } catch (e) { $('loginErr').textContent = errText(e); }
    });
    $('logoutBtn').addEventListener('click', async () => { await api('/api/logout', 'POST'); data = det = null; current = null; show(false); });

    document.addEventListener('langchange', () => {
      if ($('app').classList.contains('hidden')) return;
      drawList(); drawDetail(); drawActs(); drawLabels(); drawLeaders(); drawLog();
    });

    (async () => {
      await initLang();
      try { const r = await api('/api/me'); await enter(r.username, r.role); } catch { show(false); }
    })();
  </script>
</body>
</html>
