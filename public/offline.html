<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كشاف الفوج الثاني</title>
  <meta name="theme-color" content="#671e93">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f0fa; color: #2a1238; font-family: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif; text-align: center; padding: 1.5rem; box-sizing: border-box; }
    .card { max-width: 24rem; }
    img { width: 7rem; height: 7rem; border-radius: 1.5rem; }
    h1 { font-size: 1.4rem; margin: 1rem 0 .4rem; }
    p { margin: .3rem 0; line-height: 1.7; }
    small { color: #6b5a78; }
    button { margin-top: 1.1rem; background: #671e93; color: #fff; border: 0; border-radius: .6rem; padding: .7rem 1.6rem; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/pwa-icon-192.png" alt="">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يحتاج الموقع إلى اتصال لعرض البيانات. تحقّق من الشبكة ثم حاول مجدداً.</p>
    <small>No internet connection. Check your network and try again.</small><br>
    <button type="button" onclick="location.reload()">إعادة المحاولة / Retry</button>
  </div>

</html>
